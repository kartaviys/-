# Скопируйте в config.toml и заполните. config.toml в git не попадает.

[hh]
# Приложение регистрируется на https://dev.hh.ru/admin
client_id = ""
client_secret = ""
redirect_uri = ""                      # тот же, что указан в настройках приложения
user_agent = "hh-autoapply/1.0 (you@example.com)"   # hh требует контакт в HH-User-Agent
token_path = "token.json"

[search]
queries = [
  '"data scientist" OR "дата сайентист" OR "дата-сайентист" OR "data science" OR "специалист по анализу данных"',
  '"ml engineer" OR "ml-engineer" OR "ml инженер" OR "ml-инженер" OR "machine learning engineer" OR "инженер машинного обучения" OR "инженер по машинному обучению" OR "специалист по машинному обучению"',
  '"ml developer" OR "ml-разработчик" OR "ml разработчик" OR "разработчик ml" OR "разработчик машинного обучения" OR "ai developer" OR "ai-разработчик" OR "разработчик ai" OR "разработчик ии" OR "ии-разработчик"',
  '"ml analyst" OR "ml-аналитик" OR "ml аналитик" OR "аналитик ml" OR "аналитик машинного обучения"',
  '"ai engineer" OR "ai-инженер" OR "ai инженер" OR "инженер ai" OR "инженер ии" OR "ии-инженер" OR "llm engineer" OR "llm-инженер" OR "llm инженер" OR "genai engineer"',
  '"внедрение ai" OR "внедрению ai" OR "внедрение ии" OR "внедрению ии" OR "ai specialist" OR "ai-специалист" OR "специалист по ии" OR "специалист по искусственному интеллекту" OR "ai automation" OR "ai integration"',
  'nlp OR "обработка естественного языка" OR "natural language processing"',
  '"classic ml" OR "classical ml" OR "классическое ml" OR "классический ml" OR "классическому ml" OR "классическое машинное обучение"',
  '"data analyst" OR "аналитик данных"',
  '"applied scientist" OR "research scientist" OR "research engineer" OR "ml researcher" OR "ai researcher" OR "machine learning scientist" OR "ml scientist" OR "исследователь машинного обучения" OR "исследователь ml" OR "исследователь ai"',
  '"deep learning" OR "специалист по нейросетям" OR "разработчик нейросетей" OR "инженер нейросетей" OR "нейросетевой" OR "prompt engineer" OR "промпт-инженер" OR "промпт инженер" OR "generative ai" OR "генеративный ии" OR "genai"',
  '"рекомендательных систем" OR "recommender" OR "recsys" OR "ранжирования" OR "search ranking" OR "компьютерный лингвист" OR "computational linguist" OR "decision scientist" OR "conversational ai" OR "ai solutions"',
]
search_field = "name"                  # искать только в названии вакансии
experience = ["between3And6", "moreThan6"]   # уровень Senior
area = 113                             # 113 — вся Россия; 1 — Москва; 2 — СПб
period = 7                             # вакансии за последние N дней
max_pages = 3                          # до 100 вакансий на страницу
# schedule = "remote"                  # раскомментируйте, если нужна только удалёнка

[filters]
# Название должно содержать хотя бы одно слово из include (с начала слова) и ни одного из exclude.
# Компьютерное зрение (CV) исключено. Плюс вакансии, где в описании >= 3 упоминаний CV, тоже пропускаются.
title_include = ["data scien", "дата сайент", "дата-сайент", "анализу данных", "ml", "machine learning", "машинн", "ai", "ии", "искусственн", "llm", "genai", "nlp", "естественного языка", "natural language", "data analyst", "аналитик данных", "applied scien", "research scien", "research engineer", "ml researcher", "ai researcher", "исследователь машинн", "исследователь ml", "исследователь ai", "deep learning", "нейросет", "нейронн", "prompt", "промпт", "generative", "генеративн", "рекомендательн", "recommender", "recsys", "ranking", "ранжирован", "decision scien", "лингвист", "linguist", "conversational"]
title_exclude = ["junior", "intern", "стажер", "стажёр", "младший", "lead", "head", "руководител", "cv", "computer vision", "зрени", "opencv", "видеоаналит", "image", "изображен"]

[resumes]
ru_resume_id = ""          # id резюме на hh.ru (команда: python -m hh_autoapply resumes)
en_resume_id = ""          # id английского резюме на hh.ru (для англоязычных вакансий)
ru_title = "Senior Data Scientist"     # как называется резюме на hh (для выбора в анкете)
en_title = "Senior Data Scientist (EN)"
ru_file = "resumes/resume_ru.pdf"      # текст резюме для писем + файл для анкет на сайтах
en_file = "resumes/resume_en.pdf"      # ваше английское резюме
en_cv_url = ""             # необязательно: публичная ссылка на PDF, добавится в англ. письмо

[profile]                  # для анкет на сторонних сайтах
name = "Имя Фамилия"
name_en = "Name Surname"
email = ""
phone = ""
city = "Москва"
telegram = ""
linkedin = ""
github = ""

[llm]
providers = ["claude", "deepseek"]     # порядок: Claude основной, DeepSeek запасной
# "fallback"    — всегда первый, второй только если первый упал
# "round_robin" — по очереди, вперемешку
strategy = "fallback"

[llm.deepseek]                          # ключ: переменная окружения DEEPSEEK_API_KEY
model = "deepseek-chat"
base_url = "https://api.deepseek.com"
price_input_per_m = 0.28                # $ за 1M токенов, только для отчёта о расходах
price_output_per_m = 0.42

[llm.claude]                            # ключ: переменная окружения ANTHROPIC_API_KEY
model = "claude-haiku-5-5"              # самый дешёвый Claude
effort = "low"
price_input_per_m = 0.10
price_output_per_m = 0.50

[browser]                               # для тестов на hh и анкет на сайтах работодателей
enabled = true
profile_dir = "browser_profile"         # здесь хранится сессия входа в hh.ru
headless = false                        # true — без окна (капчи и логины тогда пропускаются)
auto_submit = false                     # false — бот заполняет, вы проверяете и жмёте «Отправить»
ask_human = true
max_steps = 6                           # сколько страниц многошаговой анкеты проходить
salary_answer = "25000"                 # ответ на ЛЮБОЙ вопрос про зарплату

[run]
dry_run = true                          # сначала посмотрите письма, потом --live
max_applications = 150                  # за один запуск
daily_limit = 150                       # в сутки (у hh максимум 200)
delay_seconds = [10, 30]                # пауза между откликами
db_path = "applications.db"

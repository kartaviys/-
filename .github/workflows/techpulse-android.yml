name: TechPulse Android APK

on:
  push:
    paths:
      - 'tech-news-android/**'
      - '.github/workflows/techpulse-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tech-news-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TechPulse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TechPulse-apk
          path: tech-news-android/TechPulse.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: techpulse-v1.0.${{ github.run_number }}
          name: ТехПульс 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: tech-news-android/TechPulse.apk
          body: |
            Скачайте **TechPulse.apk** на телефон и установите (разрешите установку из неизвестных источников).
            Новые версии ставятся поверх старой — избранное и настройки сохраняются.

name: Probe career sites (temporary)
on:
  push:
    paths:
      - "tools/probe_sites.mjs"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm init -y >/dev/null && npm i playwright@1.50.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
        working-directory: tools
      - run: node probe_sites.mjs
        working-directory: tools

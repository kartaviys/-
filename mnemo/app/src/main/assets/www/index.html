<div id="app">
  <main id="view"></main>
  <nav id="tabs">
    <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Сегодня</span></button>

<div id="modal" hidden></div>
<div id="toast"></div>
<!-- data:start -->
<script>
/* Грузим словарь только текущего языка (остальные — при переключении вкладки). */
(function () {
  window.MNEMO_PACKS = ["en","it","uk"]; var all = window.MNEMO_PACKS, gram = ["de","en","it","uk"], lang = 'en', need = [];
  try {
    var s = JSON.parse(localStorage.getItem('mnemo.v1') || 'null');
    if (s && s.settings && s.settings.lang) lang = s.settings.lang;
    if (s && (s.seeded || (s.decks || []).some(function (d) { return d.builtin; }))) need.push('en'); // старый формат — нужен английский для переноса
  } catch (e) {}
  if (all.indexOf(lang) >= 0) need.unshift(lang);
  if (!need.length) need.push('en');
  for (var i = 0; i < need.length; i++) if (need.indexOf(need[i]) === i) {
    document.write('<script src=' + '"data/pack-' + need[i] + '.js"><\/script>');
    if (gram.indexOf(need[i]) >= 0) document.write('<script src=' + '"data/grammar-' + need[i] + '.js"><\/script>');
  }
})();
</script>
<link rel="prefetch" href="data/pack-en.js">
<link rel="prefetch" href="data/pack-it.js">
<link rel="prefetch" href="data/pack-uk.js">

<link rel="prefetch" href="data/grammar-en.js">
<link rel="prefetch" href="data/grammar-it.js">
<link rel="prefetch" href="data/grammar-uk.js">
<!-- data:end -->

</body>
